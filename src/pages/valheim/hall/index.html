<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="https://yikesgaming.com/valheim/hall/">
<title>Yikesheim Hall of Fame</title>
<meta name="description" content="Who's on Yikesheim, which bosses have fallen, and the Big Yikes Hall of Fame.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090908">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Big Yikes">
<meta property="og:title" content="Yikesheim Hall of Fame">
<meta property="og:description" content="Who's online, which bosses have fallen, and who's carrying the guild this week.">
<meta property="og:url" content="https://yikesgaming.com/valheim/hall/">
<meta property="og:image" content="https://yikesgaming.com/assets/img/og-yikesheim-v8.png">
<meta name="twitter:card" content="summary_large_image">
<!--@include head-shared-->
<script src="/assets/js/progress.js?v={{site.assetVersion}}" defer></script>
<script src="/assets/js/site.js?v={{site.assetVersion}}" defer></script>
<style>
  /* Hall of Fame, after the reference's leaderboard: badge row for world progress, a thick progress bar, medal ranks,
     initials avatars. Boss trophies and biome drops are Valheim's own inventory icons (assets/valheim, CREDITS.txt). */
  .vi { filter: drop-shadow(0 2px 2px rgb(0 0 0 / .6)); }

  .now { padding: 0; }
  .now .who { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 18px; }
  .now .empty { color: var(--muted); font-weight: 700; }
  .chip-user { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--line); font-weight: 800; }

  /* Moment of the week: one standout event Jev picks from the week (Longhouse /public/stats.json "moment") */
  .moment { display: flex; align-items: center; gap: 14px; margin-top: var(--gap-3); padding: 14px 18px; background: var(--surface); border: 2px solid var(--line);
    border-bottom-width: calc(var(--lip) + 2px); border-radius: var(--radius-card); }
  .moment img { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 2px 2px rgb(0 0 0 / .6)); }
  .moment div { display: grid; gap: 2px; min-width: 0; }
  .moment b { font: 400 1.15rem var(--display); color: var(--yikes); }
  .moment span { font-weight: 700; }
  .avatar { --c: var(--yikes); width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font: 800 .95rem/1 var(--body); color: #0B0B0A; background: var(--c); box-shadow: 0 2px 0 rgb(0 0 0 / .45); }

  .seg { display: inline-flex; padding: 4px; gap: 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; margin-bottom: 14px; }
  .seg button { appearance: none; border: 0; background: none; color: var(--muted); font: 800 .8125rem var(--body); letter-spacing: .06em; text-transform: uppercase;
    padding: 0 16px; min-height: 40px; border-radius: 11px; cursor: pointer; transition: background-color var(--ease), color var(--ease); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 -3px 0 var(--yikes); }

  .board { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 40px 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; }
  .row + .row { margin-top: 4px; }
  .row:nth-child(-n+3) { background: var(--surface); }
  .rank { display: grid; place-items: center; width: 36px; height: 36px; font: 1.15rem/1 var(--display); color: var(--muted); }
  .medal { border-radius: 50%; color: var(--yikes-ink); }
  .medal.m1 { background: #FDCD00; box-shadow: 0 3px 0 #B38F00; }
  .medal.m2 { background: #C9CEC4; box-shadow: 0 3px 0 #8C9187; }
  .medal.m3 { background: #D9894A; box-shadow: 0 3px 0 #9A5B2A; }
  .row .who b { display: block; font-weight: 800; }
  .row .who span { display: block; color: var(--muted); font-size: var(--fs-sm); line-height: 20px; }
  .row .stats { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; }
  .row .stats b { color: var(--ink); font-size: 1rem; }
  .row .stats .vi { width: 20px; height: 20px; display: inline-block; vertical-align: -5px; margin-right: 4px; }
  @media (max-width: 520px) { .row { grid-template-columns: 36px 36px minmax(0, 1fr); } .row .stats { grid-column: 3; } }
  .warm { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-card); padding: 18px; color: var(--muted); }
  .empty-row { color: var(--muted); padding: 14px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<!--@include header-->
<div class="page">

  <main id="main">
    <h1>Yikesheim Hall of Fame</h1>
    <p class="lede" id="lede">Who's on, which bosses have fallen, and who's carrying the guild.</p>

    <section class="card now" aria-label="Server right now" id="now">
      <div class="status"><span class="online"><span class="dot" aria-hidden="true"></span><span id="now-state">Checking the server…</span></span><span id="now-day"></span><span id="now-ever"></span></div>
      <div class="who" id="now-players"><span class="empty">…</span></div>
    </section>

    <section class="moment" id="moment" hidden aria-label="Moment of the week">
      <img src="/assets/valheim/discovery.png" alt="" width="44" height="44">
      <div><b>Moment of the week</b><span id="moment-text"></span></div>
    </section>

    <h2>World progress</h2>
    <div id="world"></div>

    <h2>Hall of Fame</h2>
    <div class="seg" role="group" aria-label="Time range"><button type="button" data-range="week" aria-pressed="true">This week</button><button type="button" data-range="allTime" aria-pressed="false">All time</button></div>
    <ol class="board" id="board" aria-label="Most time played"></ol>
    <p class="warm" id="warm" hidden></p>
  </main>

  <footer class="footer">
    <p>Updated live from the server by Skald. Join at <a href="/valheim/">yikesgaming.com/valheim</a>.</p>
<!--@include footer-credit-->
  </footer>
</div>
<script>
(function () {
  // Avatar tints, picked by name so a viking keeps their colour.
  var TINTS = ['#FDCD00', '#3DDC84', '#5AB8FF', '#FF8A4C', '#E879C8', '#A3E635'];
  var data = null, range = 'week';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hm(m) { return m >= 60 ? Math.floor(m / 60) + 'h ' + ('0' + (m % 60)).slice(-2) + 'm' : m + ' min'; }
  function list(xs) { return xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1]; }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function icon(name, size) { return '<img class="vi" src="/assets/valheim/' + name + '.png" alt="" width="' + size + '" height="' + size + '" loading="lazy">'; }
  function avatar(name) {
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    var words = name.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
    var initials = (words.length > 1 ? words[0][0] + words[words.length - 1][0] : (words[0] || '?').slice(0, 2)).toUpperCase();  // first + last word
    return '<span class="avatar" style="--c:' + TINTS[h % TINTS.length] + '" aria-hidden="true">' + esc(initials) + '</span>';
  }

  function renderBoard() {
    var rows = (data && data[range]) || [];
    var body = document.getElementById('board');
    if (!rows.length) { body.innerHTML = '<li class="empty-row">No sessions recorded ' + (range === 'week' ? 'this week' : 'yet') + '. Go make some history.</li>'; return; }
    body.innerHTML = rows.map(function (r, i) {
      var tags = [].concat(r.bosses.length ? ['slew ' + list(r.bosses)] : [], r.firsts);
      var rank = i < 3 ? '<span class="rank medal m' + (i + 1) + '">' + (i + 1) + '</span>' : '<span class="rank">' + (i + 1) + '</span>';
      return '<li class="row">' + rank + avatar(r.player) + '<div class="who"><b>' + esc(r.player) + '</b>' + (tags.length ? '<span>' + esc(tags.join(' · ')) + '</span>' : '') + '</div>' +
        '<div class="stats"><span><b>' + hm(r.minutes) + '</b> played</span><span>' + icon('death', 20) + '<b>' + r.deaths + '</b><span class="sr-only"> Valhalla trips</span></span></div></li>';
    }).join('');
  }

  function render() {
    var d = data;
    document.getElementById('now-state').textContent = d.online ? 'Online' : 'Offline';
    document.querySelector('#now .dot').classList.toggle('off', !d.online);
    document.getElementById('now-day').textContent = d.day != null ? 'Day ' + d.day : '';
    document.getElementById('now-ever').textContent = d.playersEver ? d.playersEver + ' vikings have joined' : '';
    var count = d.playerCount != null ? d.playerCount : d.players.length, extra = Math.max(0, count - d.players.length);
    document.getElementById('now-players').innerHTML = count
      ? d.players.map(function (p) { return '<span class="chip-user">' + avatar(p) + esc(p) + '</span>'; }).join('') + (extra ? '<span class="chip-user">+' + extra + ' more</span>' : '')
      : '<span class="empty">Nobody right now. The longhouse is quiet.</span>';
    // Before Skald reports (no "updated" time) progress isn't tracked yet: the kit says so rather than guessing.
    BYProgress.render(document.getElementById('world'), { bosses: d.bosses, biomes: d.biomes, tracked: !!d.updated });
    renderBoard();
  }

  function warm(msg) {
    var w = document.getElementById('warm'); w.hidden = false; w.textContent = msg;
    document.getElementById('now-state').textContent = 'Stats are warming up';
    document.getElementById('now-players').innerHTML = '<span class="empty">Check back soon</span>';
    if (window.BYProgress) BYProgress.render(document.getElementById('world'), { tracked: false });
    document.getElementById('board').innerHTML = '';
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-range]'), function (b) {
    b.addEventListener('click', function () {
      range = b.getAttribute('data-range');
      Array.prototype.forEach.call(document.querySelectorAll('[data-range]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      renderBoard();
    });
  });

  function load() {
    fetch('https://hq.yikesgaming.com/public/stats.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { if (!d.enabled) { warm('The guild has the Hall of Fame switched off for now.'); return; } data = d; document.getElementById('warm').hidden = true; render();
        if (d.moment) { document.getElementById('moment-text').textContent = d.moment; document.getElementById('moment').hidden = false; } })
      .catch(function () { warm("Stats aren't available right now. The Hall of Fame fills in live once the server's stats service is online."); });
  }
  document.addEventListener('DOMContentLoaded', load);
  setInterval(function () { if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
