<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-home</title>
<!-- Source for assets/img/og-home-v1.png (1200x630). Re-render with tools/render.ps1. Tokens follow BY Tactile (brand.css). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700;900&amp;family=JetBrains+Mono:wght@600&amp;display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #101110; color: #F3F3ED; font-family: "Source Sans 3", sans-serif; position: relative; }
  .web { position: absolute; width: 330px; opacity: .2; }
  .web.tl { top: 0; left: 0; } .web.br { right: 0; bottom: 0; transform: rotate(180deg); }
  .logo { position: absolute; top: 60px; left: 72px; width: 200px; }
  h1 { position: absolute; left: 72px; top: 214px; width: 660px; margin: 0; font-weight: 900; font-size: 92px; line-height: .98; letter-spacing: -.02em; }
  .cta { position: absolute; left: 72px; bottom: 64px; display: inline-flex; align-items: center; font-weight: 700; font-size: 30px; height: 68px; padding: 0 28px;
    background: #FFCD00; color: #101110; border: 1px solid #C9A200; border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.22), 0 3px 0 #000; }
  .members { position: absolute; left: 434px; bottom: 84px; color: #AFB3AA; font-weight: 600; font-size: 28px; }
  .mascots { position: absolute; right: 56px; top: 96px; width: 430px; filter: drop-shadow(0 24px 40px rgba(0,0,0,.7)); }
</style>
</head>
<body>
  <img class="web tl" src="../assets/brand/web.svg" alt="">
  <img class="web br" src="../assets/brand/web.svg" alt="">
  <img class="logo" src="../assets/brand/logo-wordmark.png" alt="">
  <h1>We wipe. We laugh. We pull again.</h1>
  <div class="cta">discord.gg/bigyikes</div>
  <div class="members">About 400 members</div>
  <img class="mascots" src="../assets/brand/lockup.png" alt="">
</body>
</html>
